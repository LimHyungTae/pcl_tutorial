    <script>
      // Two SPA URL helpers that must run before React mounts:
      //
      // 1. Decode the path encoded by 404.html (GH Pages SPA redirect).
      //    A deep link that hit 404 was bounced to /?p=/<path>&q=<query>;
      //    restore the original URL so React Router sees the right path.
      // 2. Migrate legacy `#/<slug>` hash routes to `/<slug>` so old
      //    bookmarks keep working after the HashRouter → BrowserRouter
      //    switch.
      (function () {
        var loc = window.location;
        var q = loc.search;
        if (q && q.indexOf("?p=/") === 0) {
          var rest = q.slice(3).split("&");
          var p = rest[0].replace(/~and~/g, "&");
          var search = "";
          for (var i = 1; i < rest.length; i++) {
            if (rest[i].indexOf("q=") === 0) {
              search = "?" + rest[i].slice(2).replace(/~and~/g, "&");
              break;
            }
          }
          window.history.replaceState(
            null,
            "",
            loc.pathname.replace(/\/$/, "") + p + search + loc.hash
          );
        }
        if (loc.hash && loc.hash.indexOf("#/") === 0) {
          var newPath = loc.pathname.replace(/\/$/, "") + loc.hash.slice(1);
          window.history.replaceState(null, "", newPath + loc.search);
        }
      })();
    </script>
